name: Обновить сайт на Firebase

on:
  schedule:
    # каждые 5 минут: забираем свежее расписание с GitHub Pages
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: firebase-live
  cancel-in-progress: false

jobs:
  deploy:
    # автоматический коммит синхронизации не должен запускать второй прогон
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest

    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Подтянуть свежие файлы из GitHub Pages
        run: bash scripts/sync.sh

      - name: Закоммитить изменения
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "Изменений нет"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git add -A
            git commit -m "Автосинхронизация с GitHub Pages [skip ci]"
            git push || (git pull --rebase && git push)
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Firebase-деплой убран специально.
      #
      # В этом репозитории лежит только меню и старый /mypars. Его деплой
      # затирал полный layout (меню + актуальное расписание + мессенджер),
      # который собирает репозиторий sz-schedule. Именно из-за этого
      # расписание периодически отдавало 404.
      #
      # Живой сайт nkselove.web.app теперь обновляется только из sz-schedule.
